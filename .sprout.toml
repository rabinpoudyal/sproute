# Sprout dogfooding its own dev workspaces.
# Each feature branch gets an isolated worktree with its own warm build,
# running the app from that branch's source.

[project]
name = "sprout"

[worktree]
base_dir = "../sprout-worktrees"
branch_prefix = "feature/"

# No per-branch secrets to share. local_file is required by the loader but
# stays empty/unused for this project.
[env]
symlink_sources = []
local_file = ".env.local"

# Sprout keeps no database (state lives in ~/.sprout JSON). The [database]
# section is mandatory, so wire it to shell no-ops that always succeed.
[database]
create_command = "true"
drop_command = "true"
url_template = "unused"

[[setup]]
name = "build"
command = "swift build"

[run]

# GUI app: binds no network port (omit `port`). The supervisor captures stdout.
# Each branch's worktree runs its own SproutApp instance from that source.
[[run.process]]
name = "app"
command = "swift run SproutApp"

# CLI coding agents launchable inside a workspace. Sprout installs its hook
# config into the worktree so the session reports its state back over loopback.
[[agent]]
name = "builder"
command = "claude"
